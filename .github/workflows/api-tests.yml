name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kinverse
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kinverse_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinverse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out kinverse-api
        uses: actions/checkout@v4
        with:
          path: kinverse-api

      # conftest.py applies the schema automatically the first time it sees
      # an empty database, but it needs the DDL script to do it - that
      # script lives in kinverse-project (the schema's source of truth),
      # not here. Checked out as a sibling directory so conftest.py's
      # relative lookup (tests/conftest.py -> ../../../kinverse-project)
      # finds it, exactly like a local checkout with both repos side by
      # side.
      - name: Check out kinverse-project (schema source)
        uses: actions/checkout@v4
        with:
          repository: KinVerseApp/kinverse-project
          path: kinverse-project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kinverse-api/requirements.txt

      - name: Install dependencies
        working-directory: kinverse-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: kinverse-api
        env:
          KINVERSE_TEST_DATABASE_URL: postgresql+asyncpg://kinverse:test@localhost:5432/kinverse_ci_test
        run: pytest tests/ -v
